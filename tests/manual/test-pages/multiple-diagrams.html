<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Multiple Diagrams Test</title></head>
<body>
  <h1>Multiple Diagrams</h1>

  <h2>Flowchart</h2>
  <div class="mermaid">
    <svg id="mermaid-0" viewBox="0 0 500 300" xmlns="http://www.w3.org/2000/svg" aria-roledescription="flowchart">
      <style>.node rect { fill: #ddf; stroke: #66c; }</style>
      <g class="flowchart"><rect x="50" y="30" width="400" height="240" fill="#f8f8ff" rx="5"/><text x="250" y="160" text-anchor="middle">Flowchart Diagram</text></g>
    </svg>
  </div>

  <h2>Sequence</h2>
  <div class="mermaid">
    <svg id="mermaid-1" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg" aria-roledescription="sequence">
      <rect x="10" y="10" width="580" height="380" fill="#f0fff0" rx="5"/><text x="300" y="200" text-anchor="middle">Sequence Diagram</text>
    </svg>
  </div>

  <h2>Class Diagram</h2>
  <div class="mermaid">
    <svg id="mermaid-2" viewBox="0 0 450 350" xmlns="http://www.w3.org/2000/svg" aria-roledescription="classDiagram">
      <rect x="10" y="10" width="430" height="330" fill="#fff0f0" rx="5"/><text x="225" y="180" text-anchor="middle">Class Diagram</text>
    </svg>
  </div>

  <h2>State Diagram</h2>
  <div class="mermaid">
    <svg id="mermaid-3" viewBox="0 0 350 250" xmlns="http://www.w3.org/2000/svg" aria-roledescription="stateDiagram">
      <rect x="10" y="10" width="330" height="230" fill="#fffff0" rx="5"/><text x="175" y="130" text-anchor="middle">State Diagram</text>
    </svg>
  </div>

  <h2>ER Diagram</h2>
  <div class="mermaid">
    <svg id="mermaid-4" viewBox="0 0 500 400" xmlns="http://www.w3.org/2000/svg" aria-roledescription="er">
      <rect x="10" y="10" width="480" height="380" fill="#f0f0ff" rx="5"/><text x="250" y="200" text-anchor="middle">ER Diagram</text>
    </svg>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Single Diagram Test</title></head>
<body>
  <h1>Single Diagram</h1>
  <div class="mermaid">
    <svg id="mermaid-0" viewBox="0 0 400 200" xmlns="http://www.w3.org/2000/svg" aria-roledescription="flowchart">
      <style>.node rect { fill: #e8e8ff; stroke: #6666cc; } .edgePath path { stroke: #333; }</style>
      <g class="flowchart">
        <g class="node"><rect x="50" y="30" width="120" height="40" rx="5"/><text x="110" y="55" text-anchor="middle">Start</text></g>
        <g class="node"><rect x="50" y="120" width="120" height="40" rx="5"/><text x="110" y="145" text-anchor="middle">End</text></g>
        <g class="edgePaths"><path d="M110,70 L110,120" fill="none" stroke="#333" marker-end="url(#arrowhead)"/></g>
      </g>
    </svg>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Table Detection Fixture</title></head>
<body>
  <table id="basic-table">
    <thead><tr><th>Name</th><th>Age</th><th>City</th></tr></thead>
    <tbody>
      <tr><td>Alice</td><td>30</td><td>New York</td></tr>
      <tr><td>Bob</td><td>25</td><td>London</td></tr>
    </tbody>
  </table>

  <table id="no-thead-table">
    <tr><td>X</td><td>Y</td><td>Z</td></tr>
    <tr><td>1</td><td>2</td><td>3</td></tr>
  </table>

  <table id="hidden-table" style="display:none;">
    <tr><td>Hidden</td></tr>
  </table>

  <div data-expand="true">
    <table id="expand-internal-table">
      <tr><td>Internal</td></tr>
    </table>
  </div>

  <table id="empty-headers">
    <thead><tr><th></th><th>Score</th><th></th></tr></thead>
    <tbody>
      <tr><td>a</td><td>100</td><td>b</td></tr>
    </tbody>
  </table>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>GitHub Mermaid Fixture</title></head>
<body>
  <div class="js-mermaid-viewer">
    <svg aria-roledescription="flowchart" id="mermaid-1" viewBox="0 0 500 300" xmlns="http://www.w3.org/2000/svg">
      <style>.node rect { fill: #f9f; }</style>
      <g class="flowchart">
        <rect x="10" y="10" width="100" height="40" />
        <text x="60" y="35">Start</text>
      </g>
    </svg>
  </div>
  <div class="js-mermaid-viewer">
    <svg aria-roledescription="sequence" id="mermaid-2" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
      <g class="sequence">
        <rect x="10" y="10" width="80" height="30" />
      </g>
    </svg>
  </div>
  <p>Some other content</p>
</body>
</html>

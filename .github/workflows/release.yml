name: Release Store Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to package, for example v1.2.3'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  package-store:
    name: Package store zips
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Derive release version
        id: version
        env:
          TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail

          version="${TAG_NAME#v}"
          semver_core='^(0|[1-9][0-9]*)\.([0-9]|[1-9][0-9]*)\.([0-9]|[1-9][0-9]*)$'

          if [[ "$TAG_NAME" != v* || ! "$version" =~ $semver_core ]]; then
            echo "Release tags must use vMAJOR.MINOR.PATCH, for example v1.2.3." >&2
            exit 1
          fi

          IFS='.' read -r major minor patch <<< "$version"
          for part in "$major" "$minor" "$patch"; do
            if (( part > 65535 )); then
              echo "Manifest version segment '$part' must be 65535 or lower." >&2
              exit 1
            fi
          done

          echo "tag=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Run tests
        run: npm test

      - name: Normalize package version from tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Package store zips
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          npm run package:edge -- --version "$VERSION" --output "dist/expand-edge-${VERSION}.zip"
          npm run package:chrome -- --version "$VERSION" --output "dist/expand-chrome-${VERSION}.zip"
          npm run package:firefox -- --version "$VERSION" --output "dist/expand-firefox-${VERSION}.zip"

      - name: Verify package set
        id: package_set
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          package_paths=(
            "dist/expand-edge-${VERSION}.zip"
            "dist/expand-chrome-${VERSION}.zip"
            "dist/expand-firefox-${VERSION}.zip"
          )

          for package_path in "${package_paths[@]}"; do
            if [[ ! -f "$package_path" ]]; then
              echo "Missing package output: $package_path" >&2
              exit 1
            fi
          done

          {
            echo "artifact_name=expand-store-packages-${VERSION}"
            echo "edge_path=${package_paths[0]}"
            echo "chrome_path=${package_paths[1]}"
            echo "firefox_path=${package_paths[2]}"
          } >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package_set.outputs.artifact_name }}
          path: |
            ${{ steps.package_set.outputs.edge_path }}
            ${{ steps.package_set.outputs.chrome_path }}
            ${{ steps.package_set.outputs.firefox_path }}
          if-no-files-found: error

      - name: Publish GitHub Release assets
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          package_paths=(
            "dist/expand-edge-${RELEASE_VERSION}.zip"
            "dist/expand-chrome-${RELEASE_VERSION}.zip"
            "dist/expand-firefox-${RELEASE_VERSION}.zip"
          )

          for package_path in "${package_paths[@]}"; do
            if [[ ! -f "$package_path" ]]; then
              echo "Missing package output before release publication: $package_path" >&2
              exit 1
            fi
          done

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${package_paths[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${package_paths[@]}" \
              --title "Expand ${RELEASE_VERSION}" \
              --generate-notes
          fi

  version-writeback:
    name: Write version back to main
    needs: package-store
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    permissions:
      contents: write

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Derive version from tag
        id: version
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG_NAME#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Sync version files
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          node <<'NODE'
            const fs = require('fs');
            const version = process.env.VERSION;

            const updateJson = (filePath, update) => {
              const json = JSON.parse(fs.readFileSync(filePath, 'utf8'));
              update(json);
              fs.writeFileSync(filePath, `${JSON.stringify(json, null, 2)}\n`);
            };

            updateJson('package.json', (manifest) => {
              manifest.version = version;
            });

            updateJson('package-lock.json', (lockfile) => {
              lockfile.version = version;
              if (lockfile.packages && lockfile.packages['']) {
                lockfile.packages[''].version = version;
              }
            });

            updateJson('manifest.json', (manifest) => {
              manifest.version = version;
            });
          NODE

      - name: Commit and push version sync
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json manifest.json
          if git diff --cached --quiet; then
            echo "No version change to commit."
          else
            git commit -m "chore: sync version to $VERSION"
            git push origin main
          fi